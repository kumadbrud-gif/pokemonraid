<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>전설 레이드: 수학 배틀</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --ink:#3a3a48; --paper:#f8f8f0; --rim:#d8a040; --frame:#4a4e68;
  --hp-g:#48c868; --hp-y:#f0c030; --hp-r:#e84838; --hp-tag:#f0a800;
  --bg:#1f2238; --dot:#2c3152;
  --font:"Galmuri11","Galmuri9","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:8px 8px;
  color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid #6cc4ff;outline-offset:2px}
h2{margin:0 0 10px;font-size:1.25rem}
p{margin:.3em 0}
.win{background:var(--paper);border:3px solid var(--rim);border-radius:6px;padding:16px 18px;
  box-shadow:0 0 0 4px var(--frame),6px 6px 0 4px rgba(0,0,0,.35)}
.mt{margin-top:26px}
.btn{border:3px solid var(--ink);background:#fff;color:var(--ink);padding:10px 16px;border-radius:6px;box-shadow:0 4px 0 var(--ink);font-size:1rem}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.go{background:#f05a3c;color:#fff;border-color:#7a2414;box-shadow:0 4px 0 #7a2414}
.btn.blue{background:#3c78d8;color:#fff;border-color:#1c3c78;box-shadow:0 4px 0 #1c3c78}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.small{padding:4px 10px;font-size:.85rem;box-shadow:0 2px 0 var(--ink)}
.btn.big{display:block;width:100%;margin-top:18px;font-size:1.2rem;padding:14px}
input,select{font:inherit;border:3px solid var(--ink);border-radius:6px;padding:8px 10px;background:#fff;color:var(--ink);width:100%}
.lbl{display:block;margin:14px 0 6px;font-size:.95rem}
.hint{color:#77705e;font-size:.9rem}
.two{display:grid;grid-template-columns:1fr 2fr;gap:10px}
details{margin-top:18px}
summary{cursor:pointer;color:#5a5a70}

#bar{color:#e8e6f4;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px;max-width:1180px;margin:0 auto}
#bar:empty{display:none}
#bar .code{font-size:1.5rem;letter-spacing:.1em;background:#fff;color:var(--ink);padding:0 10px;border-radius:4px}
#bar .dim{color:#a8acd0;font-size:.9rem}
#bar .badge{font-size:.8rem;padding:1px 8px;border:2px solid #8890c0;border-radius:20px;color:#c8ccf0}
#bar .sp{flex:1}
main{max-width:1180px;margin:0 auto;padding:12px 14px 48px}

/* 홈 */
.hero{text-align:center;padding:24px 0 6px}
.hero .imgs{display:flex;justify-content:center;gap:4px;height:120px}
.hero .imgs img{width:120px;height:120px}
.hero h1{font-size:clamp(38px,8vw,72px);margin:0;color:#ffd848;letter-spacing:.04em;
  text-shadow:4px 4px 0 #b0401c,8px 8px 0 #121424}
.hero p{color:#c8ccf0}
.homegrid{display:grid;grid-template-columns:1fr 1fr;gap:28px;max-width:860px;margin:26px auto 0}
.modenote{max-width:860px;margin:26px auto 0;color:#a8acd0;font-size:.9rem;text-align:center}

/* 배틀 화면 */
.battle{background:#50505c;border-radius:6px;box-shadow:0 0 0 4px var(--frame),8px 8px 0 4px rgba(0,0,0,.35);overflow:hidden}
.battle.solo{max-width:680px;margin:0 auto}
.scene{position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;container-type:inline-size;
  background:linear-gradient(180deg,#fcfbf8 0%,#f4efe2 26%,#ecd9a8 34%,#f6ecd4 42%,#f3e3ba 50%,#dfba6c 58%,#f1e1b8 70%,#e8cc8c 84%,#f4e6c4 100%)}
.pad{position:absolute;border-radius:50%;
  background:radial-gradient(ellipse at center,#e8e2d2 0 52%,#d2c9b2 53% 68%,#b8ac8e 69%)}
.pad.foe{right:3%;top:40%;width:44%;height:13%}
.pad.me{left:-8%;bottom:-7%;width:58%;height:19%}
.foe-spr{position:absolute;right:9%;top:6%;width:33%;aspect-ratio:1}
.me-spr{position:absolute;left:3%;bottom:-3%;width:44%;aspect-ratio:1}
.foe-spr img,.me-spr img{width:100%;height:100%}
.spr{image-rendering:pixelated;image-rendering:crisp-edges}
.spr.flip{transform:scaleX(-1)}
.ibox{position:absolute;background:#f8f8f0;border:.7cqw solid #4a4a58;color:#38383f;font-size:3.6cqw;line-height:1.25;
  padding:1.4cqw 2.6cqw 1.6cqw;box-shadow:1cqw 1cqw 0 rgba(0,0,0,.22)}
.ibox.foe{left:0;top:6%;width:50%;border-left:0;border-radius:0 2.4cqw 2.4cqw 0}
.ibox.me{right:0;top:55%;width:52%;border-right:0;border-radius:2.4cqw 0 0 2.4cqw}
.ibox[hidden]{display:none}
.ibox .row{display:flex;justify-content:space-between;align-items:baseline;gap:2cqw}
.ibox .nm{font-size:4.6cqw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibox .lv{font-size:3.2cqw;color:#3a5ab0}
.ibox .num{text-align:right;font-size:3.3cqw;margin-top:.8cqw}
.hp{display:flex;align-items:center;gap:1cqw;margin-top:1cqw;background:#505060;padding:.5cqw .9cqw;border-radius:1cqw}
.hp b{background:var(--hp-tag);color:#5a2a00;font-size:2.6cqw;padding:0 .9cqw;border-radius:.6cqw;line-height:1.5}
.hp .track{flex:1;height:2cqw;background:#fff;border-radius:.6cqw;overflow:hidden;border:.35cqw solid #fff}
.hp .fill{height:100%;background:var(--hp-g);transition:width .8s steps(16),background .3s}
.hp .fill.y{background:var(--hp-y)}
.hp .fill.r{background:var(--hp-r)}
.dlg{padding:8px}
.dlg .in{background:#fff;border:4px solid var(--rim);border-radius:6px;padding:14px 18px;min-height:96px;
  font-size:clamp(17px,2.3vw,23px);line-height:1.65}
.dlg .q{margin:0}
.dlg .sub{font-size:.8em;color:#6a6458;margin-top:.4em}
.good{color:#1f8a3a}.bad{color:#c0392b}

/* 답 입력 */
.answer{display:flex;gap:10px;align-items:center;margin-top:14px}
.ansbox{flex:1;font-size:30px;border:3px solid var(--ink);border-radius:6px;padding:4px 12px;min-height:54px;background:#fffbe8;letter-spacing:.04em}
.ansbox:empty::before{content:"답을 입력하세요";color:#a8a090;font-size:18px}
.unit{font-size:24px;min-width:2em}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.keys button{font-size:24px;padding:8px 0;border:3px solid var(--ink);border-radius:6px;background:#fff;box-shadow:0 3px 0 var(--ink)}
.keys button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.keys .atk{grid-column:1/-1;background:#f05a3c;color:#fff;border-color:#7a2414;box-shadow:0 4px 0 #7a2414}

/* 애니메이션 */
@keyframes appear{from{transform:translateX(70%);opacity:0}to{transform:none;opacity:1}}
@keyframes lunge{0%,100%{transform:translate(0,0)}40%{transform:translate(20%,-16%)}}
@keyframes hurt{0%,100%{transform:translateX(0);opacity:1}15%,45%,75%{opacity:.15}25%{transform:translateX(-7%)}55%{transform:translateX(7%)}}
@keyframes dodge{0%,100%{transform:translateX(0)}45%{transform:translateX(18%)}}
@keyframes flee{to{transform:translateX(45%);opacity:.25}}
@keyframes cheer{50%{transform:translateY(-12%)}}
.appear{animation:appear .7s steps(7)}
.lunge{animation:lunge .5s steps(6)}
.hurt{animation:hurt .8s steps(8) .25s}
.dodge{animation:dodge .5s steps(5) .2s}
.fainted img{filter:grayscale(1);opacity:.5}

/* 포켓몬 목록 */
.mons{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px}
.mon{position:relative;border:3px solid var(--ink);background:#fff;border-radius:8px;padding:6px;text-align:center}
.mon img{width:96px;height:96px;display:block;margin:0 auto}
.mon .n{display:block;font-size:14px}
button.mon:hover:not(:disabled){background:#eef6ff}
.mon.used{background:#e8e6e0;color:#888}
.mon.used img{filter:grayscale(1);opacity:.45}
.mon.used::after{content:"쉬는 중";position:absolute;top:4px;right:4px;font-size:11px;background:#888;color:#fff;padding:0 5px;border-radius:4px}
.mon.pick{background:#fff3c4;border-color:#d08a00;box-shadow:0 0 0 3px #f0c030}
.mon .tag{position:absolute;top:4px;left:4px;font-size:11px;background:#d08a00;color:#fff;padding:0 5px;border-radius:4px}
.mon .del{position:absolute;top:2px;right:4px;border:0;background:none;font-size:20px;line-height:1;color:#a33}
.sugg{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.sugg button{width:100%;display:flex;align-items:center;gap:4px;border:2px solid var(--ink);border-radius:6px;background:#fff;padding:2px 8px 2px 2px;text-align:left}
.sugg img{width:48px;height:48px}
.sugg .no{color:#8a8270;padding:6px 2px}

/* 선생님 화면 */
.tgrid{display:grid;grid-template-columns:1.35fr 1fr;gap:28px;align-items:start}
@media (max-width:900px){.tgrid{grid-template-columns:1fr}}
.slist{display:flex;flex-direction:column;max-height:62vh;overflow:auto}
.srow{display:flex;align-items:center;gap:8px;padding:4px 2px;border-bottom:2px dashed #ddd6c2}
.srow .who{min-width:96px;white-space:nowrap}
.srow .icons{flex:1;display:flex;flex-wrap:wrap;gap:2px}
.mini img{width:42px;height:42px;display:block}
.mini.used img{filter:grayscale(1);opacity:.4}
.mini.pick{background:#fff3c4;border-radius:6px;box-shadow:0 0 0 2px #f0c030}
.srow .cnt{font-size:.85rem;color:#77705e}
.x{border:0;background:none;font-size:22px;color:#a33;padding:0 6px}
.bossgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px;max-height:260px;overflow:auto;padding:4px;border:2px solid #ddd6c2;border-radius:6px;background:#fff}
.bossgrid button{border:2px solid #d8d0b8;border-radius:6px;background:#fff;padding:2px;font-size:12px}
.bossgrid button[aria-pressed="true"]{border-color:#d08a00;background:#fff3c4;box-shadow:0 0 0 2px #f0c030}
.bossgrid img{width:64px;height:64px;display:block;margin:0 auto}
.bp{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.bp img{width:96px;height:96px}
.bp b{font-size:1.4rem}
.stepper{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stepper input{width:90px;text-align:center;font-size:1.3rem}
.tally{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px;text-align:center}
.tally span{border:2px solid #ddd6c2;border-radius:6px;padding:4px 2px;font-size:.85rem;background:#fff}
.tally b{display:block;font-size:1.6rem;line-height:1.2}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:6px;max-height:48vh;overflow:auto}
.chip{border:2px solid #bbb;border-radius:6px;padding:4px 8px;font-size:14px;background:#fff}
.chip small{display:block;font-size:12px;color:#77705e}
.chip.hit{background:#d6f5d8;border-color:#2a8a3a}
.chip.miss{background:#f8dcd6;border-color:#b03a2a}
.chip.pending{background:#fff3c4;border-color:#d08a00}
.chip.idle{color:#888}
.hist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:4px}
.hist li{display:flex;align-items:center;gap:8px}
.hist img{width:40px;height:40px}

.tools{display:flex;align-items:center;gap:8px;margin:4px 0 8px}
.chk{display:flex;gap:6px;align-items:center;cursor:pointer}
input[type=checkbox]{width:20px;height:20px;padding:0;accent-color:#3c78d8;flex:none;cursor:pointer}
.tools .sp{flex:1}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#c8c0b0;flex:none;vertical-align:middle}
.dot.on{background:#2cc05a;box-shadow:0 0 0 3px #c8f2d4}
.srow .btn.small{padding:2px 8px}
.grant{width:100%;max-width:760px;max-height:90vh;overflow:auto}
.rooms{display:flex;flex-direction:column;gap:12px}
.rooms .btn{text-align:left}


/* 내 화면 */
.hubtop{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.hubtop .me{width:190px;flex:none}
.hubinfo h2{font-size:1.5rem}
.banners{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-top:26px}
.banner{position:relative;border:3px solid #1e1e2a;border-radius:10px;padding:14px;text-align:left;box-shadow:0 5px 0 #1e1e2a;display:flex;flex-direction:column;gap:2px;min-height:118px;color:#fff}
.banner:active{transform:translateY(3px);box-shadow:0 2px 0 #1e1e2a}
.banner .ic{font-size:36px;line-height:1.1}
.banner b{font-size:1.08rem}
.banner small{font-size:.82rem;opacity:.95}
.b1{background:#e8603c}.b2{background:#c8403a}.b3{background:#f0b030;color:#3a2a00}.b4{background:#3fa55a}.b5{background:#7a5ad0}
.badge2{position:absolute;top:-10px;right:-8px;background:#ff3b5c;color:#fff;border:2px solid #fff;border-radius:20px;padding:0 9px;font-size:.9rem}
.badge2[hidden]{display:none}
.friends{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:16px}
.fcard{text-align:center}
.fcard.mine .rcard{box-shadow:0 0 0 4px #f0c030}
.fname{margin-top:6px;font-size:14px}
.fmon{font-size:12px;color:#77705e}
.rcard{position:relative;border:3px solid var(--ink);border-radius:10px;background:linear-gradient(#ffffff,#efe9da);overflow:hidden;aspect-ratio:1/1.1;container-type:inline-size}
.rcard .band{position:absolute;left:0;right:0;bottom:0;height:20%;display:flex;align-items:center;justify-content:center;font-size:9cqw;letter-spacing:.06em;overflow:hidden;white-space:nowrap;border-top:2px solid rgba(0,0,0,.15)}
.rcard .stage{position:absolute;inset:4% 4% 16% 4%}
.rcard .stage img.spr{position:absolute;left:50%;top:50%;width:80%;height:auto;aspect-ratio:1;transform:translate(-50%,-50%)}
.rcard .egg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:34cqw}
.rcard .stage img.acc{position:absolute;width:calc(var(--w,12)*1.7cqw);height:auto;transform:translate(-50%,-50%) scale(var(--s,1));image-rendering:pixelated;image-rendering:crisp-edges}
.acc.head{left:50%;top:16%}.acc.face{left:50%;top:47%}
.rcard .stage img.acc.face{width:calc(var(--w,12)*1.4cqw)}.acc.hold{left:80%;top:76%}.acc.aura{left:17%;top:20%}
.repbig{max-width:320px;margin:0 auto}
.phead{display:flex;align-items:center;gap:12px;margin:0 0 16px}
.phead h2{margin:0;color:#fff}
.mcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.mcard{border:3px solid var(--ink);border-radius:8px;background:#fff;padding:8px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.mcard img{width:96px;height:96px}
.mcard .pw{color:#c0392b;font-size:14px}
.mcard.used img{filter:grayscale(1);opacity:.5}
.mcard.pick{background:#fff3c4;border-color:#d08a00}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.tabs button[aria-pressed="true"]{background:#3c78d8;color:#fff;border-color:#1c3c78}
.dexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:6px}
.dx{border:2px solid #ddd6c2;border-radius:6px;background:#fff;text-align:center;padding:2px 2px 4px;font-size:12px;line-height:1.3}
.dx img{width:68px;height:68px;display:block;margin:0 auto}
.dx:not(.own){background:#ece8de;color:#9a9282}
.dx:not(.own) img{filter:brightness(0);opacity:.22}
.dx span{display:block;color:#9a9282;font-size:11px}
.chips2{display:flex;flex-wrap:wrap;gap:6px}
.chips2 button{border:2px solid var(--ink);border-radius:20px;background:#fff;padding:4px 12px}
.chips2 button[aria-pressed="true"]{background:#fff3c4;border-color:#d08a00;box-shadow:0 0 0 2px #f0c030}
.slotrow .lbl{margin:12px 0 6px}
textarea{font:inherit;border:3px solid var(--ink);border-radius:6px;padding:8px 10px;width:100%;min-height:110px;resize:vertical;background:#fff;color:var(--ink)}
.gcard{border:2px solid #ddd6c2;border-radius:8px;background:#fff;padding:10px 12px;margin-bottom:10px}
.gmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.gtext{white-space:pre-wrap;margin:6px 0;word-break:break-word}
.tag2{font-size:12px;background:#3fa55a;color:#fff;border-radius:10px;padding:0 8px}
.st{font-size:12px;border-radius:10px;padding:0 8px;border:2px solid}
.st.pending{border-color:#d08a00;color:#a06a00}.st.approved{border-color:#2a8a3a;color:#1f6a2c}.st.returned{border-color:#b03a2a;color:#a0392b}
.rw{display:flex;flex-wrap:wrap;gap:14px;margin:8px 0}
.rwi{display:flex;align-items:center;gap:5px;font-size:14px}
.rwi b{min-width:1.2em;text-align:center}
.gbtns{display:flex;gap:8px;flex-wrap:wrap}
.icards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.icard{border:3px solid var(--ink);border-radius:10px;background:#fff;padding:16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.icard .ie{font-size:52px;line-height:1.1}
.icard .cnt2{font-size:1.5rem}
.center{text-align:center}
.big2{font-size:1.5rem;margin:.3em 0}
.reveal{font-size:110px;line-height:1.2;animation:pop .6s steps(6)}
.reveal-bg{width:220px;margin:12px auto;animation:pop .6s steps(6)}
@keyframes pop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.evobox{position:relative;width:192px;height:192px;margin:10px auto}
.evobox img{position:absolute;inset:0;width:100%;height:100%}
.evoing .e1{animation:evoOld 2.6s steps(26) forwards}
.evoing .e2{opacity:0;animation:evoNew 2.6s steps(26) forwards}
@keyframes evoOld{0%{filter:none}15%,90%{filter:brightness(0) invert(1)}30%,50%,70%{opacity:1}40%,60%,80%{opacity:.2}100%{opacity:0;filter:brightness(0) invert(1)}}
@keyframes evoNew{0%,40%{opacity:0;filter:brightness(0) invert(1)}45%,65%,85%{opacity:.9}55%,75%{opacity:0}92%{opacity:1;filter:brightness(0) invert(1)}100%{opacity:1;filter:none}}


.critfx{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);font-size:11cqw;color:#ffe03a;white-space:nowrap;z-index:5;
  text-shadow:.5cqw .5cqw 0 #b0401c,-.3cqw -.3cqw 0 #1a1c30,1cqw 1cqw 0 #1a1c30;animation:critpop 1.3s steps(10) forwards;pointer-events:none}
@keyframes critpop{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}20%{transform:translate(-50%,-50%) scale(1.25);opacity:1}35%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%)}}
.crit{color:#e8603c}
.repbig .acc{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.repbig .acc.dragging{cursor:grabbing;filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 2px #f0c030);z-index:3}

.sizes{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.szrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.szname{min-width:130px}
.szrow b{min-width:3.2em;text-align:center}
.pxi{image-rendering:pixelated;image-rendering:crisp-edges;vertical-align:middle}
.rcard .band{gap:2cqw}
.bandi{height:62%;width:auto;image-rendering:pixelated;image-rendering:crisp-edges;flex:none}
.pxstars{position:absolute;inset:0 0 20% 0;background-image:radial-gradient(#fff 0 .7cqw,transparent .8cqw),radial-gradient(#ffe88a 0 .5cqw,transparent .6cqw);background-size:23cqw 19cqw,31cqw 27cqw;background-position:4cqw 3cqw,15cqw 11cqw;opacity:.85}
.swatch{display:inline-block;width:22px;height:16px;border:2px solid var(--ink);border-radius:3px;vertical-align:middle}
.reveal .pxi{animation:pop .6s steps(6)}
.mixed{display:inline-flex;align-items:center;gap:2px;vertical-align:middle;margin:0 2px}
.fr{display:inline-flex;flex-direction:column;align-items:center;font-size:.78em;line-height:1.1}
.fr span:first-child{border-bottom:2px solid currentColor;padding:0 3px}
.fr span:last-child{padding:0 3px}
.fracin{display:flex;align-items:center;gap:8px}
.fstack{display:flex;flex-direction:column;align-items:center;gap:4px}
.fline{display:block;width:64px;height:3px;background:var(--ink)}
.fbox{min-width:64px;height:44px;font-size:26px;border:3px solid var(--ink);border-radius:6px;background:#fffbe8;padding:0 6px}
.fbox.w{height:60px;min-width:56px}
.fbox.on{background:#fff3c4;border-color:#d08a00;box-shadow:0 0 0 3px #f0c030}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:12px}
.choices button{font-size:20px;padding:10px 8px;border:3px solid var(--ink);border-radius:8px;background:#fff;box-shadow:0 3px 0 var(--ink)}
.choices button[aria-pressed="true"]{background:#fff3c4;border-color:#d08a00}
.lgraph{display:block;width:100%;max-width:420px;margin:8px auto 0;background:#fff;border:2px solid #ddd6c2;border-radius:6px}
.lgraph .gt{font-size:13px;fill:#3a3a48}.lgraph .gl{font-size:11px;fill:#5a5a68}
.lgraph .gg{stroke:#c8c2b0;stroke-width:1}.lgraph .gg2{stroke:#ece8de;stroke-width:1}.lgraph .ga{stroke:#3a3a48;stroke-width:1.5}
.lgraph .gp{fill:none;stroke:#e8603c;stroke-width:2.5}.lgraph .gd{fill:#3a3a48}
.units button{font-size:14px}
/* 결과 */
.result{text-align:center;padding:28px 18px;max-width:680px;margin:0 auto}
.result .rspr img{width:min(60vw,288px);height:auto;aspect-ratio:1}
.result .big{font-size:clamp(28px,5vw,48px);margin:.2em 0}
.result.caught .rspr{animation:cheer .5s steps(3) 3}
.result.caught .big{color:#1f8a3a}
.result.fled .rspr img{animation:flee 1.2s steps(10) forwards}
.result.fled .big{color:#7a6a58}

#modal{position:fixed;inset:0;background:rgba(10,12,24,.75);display:grid;place-items:center;z-index:50;padding:20px}
#modal[hidden]{display:none}
.qrwrap{text-align:center}
.qrbox{display:inline-block;background:#fff;padding:14px;margin:10px 0}
.qrcode{font-size:2.6rem;letter-spacing:.12em}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;border:3px solid var(--ink);
  padding:10px 18px;border-radius:6px;z-index:60;box-shadow:0 4px 0 var(--ink);max-width:90vw}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:520px){.homegrid{gap:22px}.keys button{font-size:22px}}

const LEGENDS=[[144,"프리져"],[145,"썬더"],[146,"파이어"],[150,"뮤츠"],[151,"뮤"],[243,"라이코"],[244,"앤테이"],[245,"스이쿤"],[249,"루기아"],[250,"칠색조"],[377,"레지락"],[378,"레지아이스"],[379,"레지스틸"],[380,"라티아스"],[381,"라티오스"],[382,"가이오가"],[383,"그란돈"],[384,"레쿠쟈"],[385,"지라치"],[386,"테오키스"],[480,"유크시"],[481,"엠라이트"],[482,"아그놈"],[483,"디아루가"],[484,"펄기아"],[485,"히드런"],[486,"레지기가스"],[487,"기라티나"],[488,"크레세리아"],[491,"다크라이"],[493,"아르세우스"],[638,"코바르온"],[639,"테라키온"],[640,"비리디온"],[641,"토네로스"],[642,"볼트로스"],[643,"레시라무"],[644,"제크로무"],[645,"랜드로스"],[646,"큐레무"],[716,"제르네아스"],[717,"이벨타르"],[718,"지가르데"],[791,"솔가레오"],[792,"루나아라"],[800,"네크로즈마"],[888,"자시안"],[889,"자마젠타"],[890,"무한다이노"]];

// 5세대 이후 이름은 인터넷에서 불러와 더해요(실패해도 1~4세대는 그대로 쓸 수 있어요).
function loadMoreNames(){
  fetch("https://raw.githubusercontent.com/PokeAPI/pokeapi/master/data/v2/csv/pokemon_species_names.csv")
    .then(r=>r.ok?r.text():"").then(t=>{
      t.split("\n").forEach(line=>{const p=line.split(",");
        if(p[1]==="3"){const id=+p[0],n=(p[2]||"").trim(); if(id>0&&n&&!NAMES[id])NAMES[id]=n;}});
    }).catch(()=>{});
}
const nameOf=id=>NAMES[id]||("#"+id);
const SPRITE="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/";
function spr(id,back){
  return `<img class="spr" src="${SPRITE}${back?"back/":""}${id}.png" data-id="${id}" data-back="${back?1:0}" alt="${esc(nameOf(id))}" onerror="sprFail(this)">`;
}
window.sprFail=img=>{
  if(img.dataset.back==="1"){img.dataset.back="2";img.classList.add("flip");img.src=SPRITE+img.dataset.id+".png";}
  else{img.onerror=null;img.removeAttribute("src");}
};

/* ---------------- 도구 ---------------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const arr=x=>Array.isArray(x)?x.filter(v=>v!=null):(x&&typeof x==="object"?Object.values(x):[]);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function h(html){const t=document.createElement("template");t.innerHTML=html.trim();return t.content.firstElementChild;}
function refs(root){const o={};root.querySelectorAll("[data-r]").forEach(e=>{o[e.dataset.r]=e;});return o;}
function setHTML(el,html){if(el&&el._h!==html){el._h=html;el.innerHTML=html;}}
function critFx(scene){if(!scene)return;const f=h('<div class="critfx">크리티컬!</div>');scene.append(f);setTimeout(()=>f.remove(),1300);}
function restart(el,cls){el.classList.remove("lunge","hurt","dodge","appear");void el.offsetWidth;el.classList.add(cls);}
function josa(w,a,b){
  const c=w.charCodeAt(w.length-1);
  if(c>=0xAC00&&c<=0xD7A3)return w+(((c-0xAC00)%28)?a:b);
  if(/[0-9]$/.test(w))return w+("013678".includes(w.slice(-1))?a:b);
  return w+b;
}
function toast(msg){const t=h(`<div class="toast" role="status">${esc(msg)}</div>`);document.body.append(t);setTimeout(()=>t.remove(),2600);}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error(src));document.head.append(s);});}

/* ---------------- 저장소 (Firebase 또는 테스트 모드) ---------------- */
const LKEY="pkraid-local-db";
function getAt(o,path){for(const k of path.split("/").filter(Boolean)){if(o==null)return null;o=o[k];}return o??null;}
function setAt(o,path,val){
  const ks=path.split("/").filter(Boolean);
  for(let i=0;i<ks.length-1;i++){if(typeof o[ks[i]]!=="object"||o[ks[i]]===null)o[ks[i]]={};o=o[ks[i]];}
  const last=ks[ks.length-1];
  if(val===null||val===undefined)delete o[last];else o[last]=JSON.parse(JSON.stringify(val));
}
const clone=x=>x==null?null:JSON.parse(JSON.stringify(x));
const Store={
  mode:"local",tree:{},subs:new Set(),
  async init(){
    if(FIREBASE_CONFIG&&FIREBASE_CONFIG.databaseURL){
      try{
        await loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js");
        await loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js");
        firebase.initializeApp(FIREBASE_CONFIG);
        this.db=firebase.database();this.mode="online";return;
      }catch(e){toast("온라인 연결에 실패해서 테스트 모드로 시작해요.");}
    }
    this.tree=this.load();
    addEventListener("storage",e=>{if(e.key===LKEY){this.tree=this.load();this.fire();}});
  },
  load(){try{return JSON.parse(localStorage.getItem(LKEY))||{};}catch(e){return{};}},

  on(path,cb){

  },
  async set(path,val){
    if(this.mode==="online")return this.db.ref(path).set(val);
    setAt(this.tree,path,val);this.save();
  },
  async update(path,obj){
    if(this.mode==="online")return this.db.ref(path).update(obj);
    for(const[k,v]of Object.entries(obj))setAt(this.tree,path+"/"+k,v);this.save();
  }
};

function makeProblem(units){

  s+=`<line x1="${L}" x2="${L}" y1="${Tp}" y2="${H-B}" class="ga"/><line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" class="ga"/>`;

function freq(n){const m=n.match(/^([A-G])([#b]?)(\d)$/);const s={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]==="#"?1:m[2]==="b"?-1:0);

function compile(song){
  if(song.c)return song.c;const steps=new Map();let len=0;
  const put=(t,e)=>{if(!steps.has(t))steps.set(t,[]);steps.get(t).push(e);};
  song.ch.forEach((c,ci)=>{let t=0;c.n.trim().split(/\s+/).forEach(tok=>{const[nm,d]=tok.split(":");if(nm!=="-")put(t,{ci,f:freq(nm),d:+d});t+=+d;});len=Math.max(len,t);});
  if(song.dr){[...song.dr].forEach((ch,i)=>{if(ch!=="-")put(i,{dr:ch});});len=Math.max(len,song.dr.length);}
  return song.c={steps,len};
}
const Snd={
  ctx:null,mode:localStorage.getItem("pkraid-snd")||"all",want:null,cur:null,gen:0,
  init(){
    if(this.ctx)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    const c=this.ctx=new AC();

    this.bus={bgm:c.createGain(),sfx:c.createGain()};

    this.bus.bgm.connect(this.out);this.bus.sfx.connect(this.out);
    const b=this.noiseBuf=c.createBuffer(1,c.sampleRate,c.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  },
  ready(){return this.ctx&&this.ctx.state==="running";},
  unlock(){

  },
  label(){return {all:"🔊 소리 켜짐",sfx:"🔉 효과음만",off:"🔇 소리 꺼짐"}[this.mode];},
  setMode(m){this.mode=m;localStorage.setItem("pkraid-snd",m);if(m!=="all")this.stop();else{this.cur=null;this.bgm(this.want);}},
  cycle(){this.setMode({all:"sfx",sfx:"off",off:"all"}[this.mode]);},
  stop(){this.gen++;this.cur=null;},
  bgm(name){
    this.want=name;

    this.stop();this.cur=name;
    const s=SONGS[name],c=compile(s),sd=60/s.bpm/4,gen=this.gen;let i=0,t=this.ctx.currentTime+.08;
    const tick=()=>{
      if(gen!==this.gen)return;

  },
  once(name){
    if(this.mode==="off"||!this.ready())return;

  noise(t,d,v,type,fq,bus,fq2){

  },
  drum(k,t,bus){

function applyGD(d){GD.bst=d.bst;GD.children={};for(const[c,p]of Object.entries(d.par))(GD.children[p]=GD.children[p]||[]).push(+c);GD.ready=true;}
async function loadGameData(){
  let cached=null;try{cached=JSON.parse(localStorage.getItem("pkraid-gd1"));}catch(e){}
  if(cached&&cached.bst){applyGD(cached);if(Date.now()-cached.at<7*864e5)return;}
  try{
    const base="https://raw.githubusercontent.com/PokeAPI/pokeapi/master/data/v2/csv/";
    const [sp,stt]=await Promise.all(["pokemon_species.csv","pokemon_stats.csv"].map(f=>fetch(base+f).then(r=>{if(!r.ok)throw new Error(f);return r.text();})));
    const par={},bst={};
    const L1=sp.trim().split("\n"),h1=L1[0].trim().split(","),iI=h1.indexOf("id"),iP=h1.indexOf("evolves_from_species_id");
    for(const l of L1.slice(1)){const c=l.split(",");const p=+c[iP];if(p)par[+c[iI]]=p;}
    const L2=stt.trim().split("\n"),h2=L2[0].trim().split(","),jI=h2.indexOf("pokemon_id"),jB=h2.indexOf("base_stat");
    for(const l of L2.slice(1)){const c=l.split(",");const id=+c[jI];if(id>0&&id<10000)bst[id]=(bst[id]||0)+(+c[jB]||0);}
    if(Object.keys(bst).length<400||Object.keys(par).length<100)throw new Error("data");
    const d={bst,par,at:Date.now()};applyGD(d);
    try{localStorage.setItem("pkraid-gd1",JSON.stringify(d));}catch(e){}
  }catch(e){if(!GD.ready)GD.failed=true;}
  if(S.role)render();
}

const PXC={};
function pxSprite(id){
  if(PXC[id])return PXC[id];
  const rows=(PX[id]||"").replace(/^\n/,"").split("\n");
  const w=Math.max(...rows.map(r=>r.length),1),hgt=rows.length;
  const c=document.createElement("canvas");c.width=w;c.height=hgt;const g=c.getContext("2d");
  rows.forEach((r,y)=>[...r].forEach((ch,x)=>{if(PXPAL[ch]){g.fillStyle=PXPAL[ch];g.fillRect(x,y,1,1);}}));
  return PXC[id]={src:c.toDataURL(),w,h:hgt};
}

async function joinRoom(code){
  if(!/^\d{6}$/.test(code)){toast("방 코드 6자리를 입력해 주세요.");return false;}
  const meta=await Store.get(`rooms/${code}/meta`);
  if(!meta){toast("그런 방이 없어요. 방 코드를 확인해 주세요.");return false;}
  const u=S.user;
  if(!(await Store.get(`rooms/${code}/students/${u.key}`)))
    await Store.set(`rooms/${code}/students/${u.key}`,{name:u.name,num:u.num,joined:Date.now()});
  await Store.set(`accounts/${u.key}/rooms/${code}`,true);
  return enterRoom("student",code);
}
async function readLogin(){
  const num=parseInt($("#lNum").value),name=$("#lName").value.trim(),pw=$("#lPw").value;
  if(!(num>=1&&num<=99)){toast("번호를 입력해 주세요.");return null;}
  if(!name){toast("이름을 입력해 주세요.");return null;}
  if(pw.length<4){toast("비밀번호를 4자리 이상 입력해 주세요.");return null;}
  const base=userKey(name,num),hash=await hashPw(base,pw);
  return {base,name,num,pw:hash,look:"L_"+base+"_"+hash.slice(0,16)};
}
/* 계정 찾기: 번호, 이름, 비밀번호가 모두 같아야 같은 계정이에요 */
async function findAccount(u){
  const uid=await Store.get("accounts/"+u.look);
  if(uid){const acc=await Store.get("accounts/"+uid);if(acc&&acc.pw===u.pw)return uid;}
  const old=await Store.get("accounts/"+u.base); // 예전 방식으로 만든 계정
  if(old&&old.pw===u.pw&&old.name){await Store.set("accounts/"+u.look,u.base);return u.base;}
  return null;
}
async function afterLogin(u){
  S.user=u;ls().setItem("pkraid-user",JSON.stringify(u));
  if(!localStorage.getItem("pkraid-snd"))Snd.setMode("sfx");
  if(S.pending){const c=S.pending;S.pending=null;if(await joinRoom(c))return;}
  show("lobby",StudentLobby);
}

function TeacherRaid(){
  let R;
  return{
    mount(m){
      const {meta,atts,parts}=D();
      T.queue=[];T.playing=false;
      T.seen=new Set(Object.entries(atts).filter(([,a])=>a&&a.status!=="pending").map(([k])=>k));
      const el=h(`<div class="tgrid">
        <div class="battle">${sceneHTML(meta.boss)}<div class="dlg"><div class="in" data-r="msg"></div></div></div>
        <section class="win"><h2>${meta.raidNo}번째 레이드 (참여 ${Object.keys(parts).length}명)</h2><p class="hint">${arr(meta.units).length?arr(meta.units).map(k=>UNITS[k]).filter(Boolean).join(", "):UNITS.dec}</p><div class="tally" data-r="tally"></div>
          <div class="chips" data-r="chips"></div><button class="btn go big" data-act="endRaid">레이드 종료</button></section>
      </div>`);
      m.append(el);R=refs(el);
      R.foe.classList.add("appear");setTimeout(()=>Snd.cry(meta.boss),500);
      R.msg.textContent=`야생의 ${josa(nameOf(meta.boss),"이","가")} 나타났다!`;
    },
    update(){
      const {students,atts,parts}=D();updateFoe(R);
      const list=sorted(students).filter(([k])=>parts[k]||atts[k]);let c={hit:0,miss:0,pending:0,idle:0};
      setHTML(R.chips,list.map(([sid,st])=>{
        const a=atts[sid];let cls="idle",txt="포켓몬 고르는 중";
        if(a){cls=a.status;txt=a.status==="hit"?`${nameOf(a.mon)} ${a.crit?"크리티컬! (2번)":"명중"}`:a.status==="miss"?`${nameOf(a.mon)} 빗나감`:`${nameOf(a.mon)} 문제 푸는 중`;}
        c[cls]++;
        return `<div class="chip ${cls}"><span class="dot${isOnline(sid)?" on":""}"></span> ${st.num}번 ${esc(st.name)}<small>${esc(txt)}</small></div>`;
      }).join(""));
      setHTML(R.tally,`<span><b>${c.hit}</b>명중</span><span><b>${c.miss}</b>빗나감</span><span><b>${c.pending}</b>푸는 중</span><span><b>${c.idle}</b>고르는 중</span>`);
      Object.entries(atts).filter(([k,a])=>a&&a.status!=="pending"&&!T.seen.has(k))
        .sort((x,y)=>(x[1].done||0)-(y[1].done||0))
        .forEach(([k,a])=>{T.seen.add(k);const st=students[k];T.queue.push({who:st?`${st.num}번 ${st.name}`:"",name:st?st.name:"",mon:a.mon,hit:a.status==="hit",crit:!!a.crit});});
      playNext(R);
    }
  };
}

function playNext(R){
  if(T.playing||!T.queue.length||!R.msg.isConnected)return;
  T.playing=true;const ev=T.queue.shift();const fast=T.queue.length>4;
  R.me.className="me-spr";R.me.innerHTML=spr(ev.mon,true);R.mebox.hidden=false;
  R.mename.textContent=nameOf(ev.mon);R.menum.textContent=ev.who;
  restart(R.me,"lunge");restart(R.foe,ev.hit?"hurt":"dodge");
  R.msg.textContent=ev.hit?`${ev.name}의 ${nameOf(ev.mon)}! 공격이 명중했다!`:`${ev.name}의 ${nameOf(ev.mon)}! 공격이 빗나갔다!`;
  if(!ev.hit)R.me.classList.add("fainted");
  if(!fast)Snd.cry(ev.mon);setTimeout(()=>Snd.sfx(ev.hit?"hit":"miss"),fast?200:450);
  if(ev.crit){R.msg.textContent=`크리티컬! ${ev.name}의 ${nameOf(ev.mon)}! 급소에 맞아서 두 번 명중했다!`;
    setTimeout(()=>{if(!R.foe.isConnected)return;critFx(R.foe.parentElement);restart(R.me,"lunge");restart(R.foe,"hurt");Snd.sfx("hit");},700);}
  setTimeout(()=>{T.playing=false;playNext(R);},ev.crit?2200:fast?700:1500);
}

function studentRoute(){
  const {meta,students,raid,atts,parts}=D();const me=students[S.sid];
  if(!me){toast("선생님이 이 방 명단에서 뺐어요.");exitRoom();return;}
  if(meta.stage==="raid"){
    if(atts[S.sid])return show("S-battle-"+raid,StudentBattle);
    if(parts[S.sid]&&arr(me.mons).length){
      const pick=me.pick;
      if(pick&&pick.raid===raid&&available(me).includes(pick.mon))createAttempt(pick.mon);
      return show("S-pick-"+raid,StudentPick);
    }
  }
  if(meta.stage==="result"&&S.ack!==raid)return show("S-result-"+raid,StudentResult);
  const pg=PAGES[S.page]?S.page:"hub";
  show("S-"+pg,PAGES[pg]);
}

async function createAttempt(mon){
  const {meta,students,raid,atts}=D();
  if(meta.stage!=="raid"||atts[S.sid]||S.creating===raid)return;
  const me=students[S.sid];let used=arr(me.used);
  if(allUsed(me))used=[];
  if(used.includes(mon))return;
  S.creating=raid;used.push(mon);
  const p=makeProblem(meta.units);
  try{
    await Store.update("rooms/"+S.code,{
      [`attempts/r${raid}/${S.sid}`]:{mon,...p,status:"pending",at:Date.now()},
      [`students/${S.sid}/used`]:used,[`students/${S.sid}/pick`]:null});
  }catch(e){S.creating=null;toast("저장하지 못했어요. 다시 눌러 주세요.");}
}


function search(q){
  q=q.replace(/\s/g,"");if(!q)return[];
  const out=[];
  for(const [id,n] of Object.entries(NAMES)){const i=n.indexOf(q);if(i>=0)out.push([+id,n,i]);}
  return out.sort((a,b)=>a[2]-b[2]||a[0]-b[0]).slice(0,10);
}

function chooseEvo(id){
  const st=D().students[S.sid],kids=(GD.children[id]||[]).slice().sort((a,b)=>a-b);
  if(!kids.length)return toast("최종 진화한 포켓몬이에요.");

  const have=arr(st.mons);
  openModal(`<h2>${esc(josa(nameOf(id),"은","는"))} 여러 모습으로 진화할 수 있어요. 무엇으로 진화할까요?</h2><div class="mons mt">${kids.map(k=>`
    <button class="mon${have.includes(k)?" used":""}" ${have.includes(k)?"disabled":""} data-act="evoTo" data-from="${id}" data-to="${k}">${spr(k,false)}<span class="n">${esc(nameOf(k))}</span>${have.includes(k)?'<span class="hint">이미 있어요</span>':""}</button>`).join("")}</div>
    <button class="btn big" data-act="closeModal">닫기</button>`);
}
async function evolve(from,to){
  const st=D().students[S.sid],n=(st.items||{}).evo||0;if(n<1)return;
  const mons=arr(st.mons);
  if(mons.includes(to))return toast(`이미 ${josa(nameOf(to),"을","를")} 가지고 있어서 진화할 수 없어요.`);
  if(!confirm(`${josa(nameOf(from),"을","를")} ${josaRo(nameOf(to))} 진화시킬까요?`))return;
  const boosts=Object.assign({},st.boosts||{});const b=boosts["p"+from]||0;delete boosts["p"+from];if(b)boosts["p"+to]=b;
  const sw=x=>x===from?to:x;
  await Store.update(`rooms/${S.code}/students/${S.sid}`,{
    mons:mons.map(sw),used:arr(st.used).map(sw),rep:st.rep===from?to:(st.rep??null),
    pick:st.pick&&st.pick.mon===from?{raid:st.pick.raid,mon:to}:(st.pick||null),
    boosts:Object.keys(boosts).length?boosts:null,"items/evo":n-1,[`dex/p${from}`]:true,[`dex/p${to}`]:true});
  openModal(`<div class="center"><h2>어라…?</h2><div class="evobox evoing">${spr(from,false).replace('class="spr"','class="spr e1"')}${spr(to,false).replace('class="spr"','class="spr e2"')}</div>
    <p id="evomsg">${esc(nameOf(from))}의 모습이…!</p><div id="evobtn"></div></div>`);
  Snd.cry(from);
  setTimeout(()=>{const m=$("#evomsg");if(!m)return;
    m.textContent=`축하해요! ${josa(nameOf(from),"이","가")} ${josaRo(nameOf(to))} 진화했어요!`;
    $("#evobtn").innerHTML='<button class="btn blue big" data-act="closeModal">좋아요!</button>';
    Snd.once("win");setTimeout(()=>Snd.cry(to),900);},2600);
}
async function openDeco(){
  const st=D().students[S.sid],n=(st.items||{}).deco||0;if(n<1)return;
  const have=st.decos||{};
  const accs=Object.keys(DECOS).filter(k=>!have[k]),bgs=Object.keys(BGS).filter(k=>!have[k]);
  if(!accs.length&&!bgs.length)return toast("모든 꾸미기를 다 모았어요! 상자는 그대로 남겨 둘게요.");
  const isBg=bgs.length&&(!accs.length||Math.random()<0.05);
  const pool=isBg?bgs:accs,got=pool[rnd(0,pool.length-1)];
  await Store.update(`rooms/${S.code}/students/${S.sid}`,{"items/deco":n-1,[`decos/${got}`]:true});
  const slot=isBg?"bg":DECOS[got][2];
  const preview=isBg?`<div class="rcard reveal-bg" style="background:${BGS[got].g}">${bgStars(BGS[got])}${bgBand(BGS[got])}</div>`
    :`<div class="reveal">${pxIcon(got,9)}</div>`;
  Snd.once("win");
  openModal(`<div class="center"><h2>${isBg?"✨ 아주 드문 배경이 나왔어요! ✨":"꾸미기 상자를 열었어요!"}</h2>${preview}
    <p class="big2">${esc(isBg?BGS[got].n:DECOS[got][0])}</p><p class="hint">${SLOTS[slot]}에 다는 꾸미기예요.</p>

    <button class="btn big" data-act="closeModal">나중에 달기</button></div>`);
}

      </div><span class="unit">${esc(att.unit)}</span></div><p class="hint">칸을 눌러서 고르고 숫자를 넣어요. 자연수가 없으면 왼쪽 칸은 비워 두세요.</p>
      <div class="keys">${["7","8","9","del","4","5","6","next","1","2","3","0"].map(KEYS).join("")}<button class="atk" data-act="key" data-k="ok">공격!</button></div>`;
    return `<div class="answer"><div class="ansbox" aria-live="polite"></div><span class="unit">${esc(att.unit)}</span></div>
      <div class="keys">${["7","8","9","del","4","5","6",".","1","2","3","0"].map(KEYS).join("")}<button class="atk" data-act="key" data-k="ok">공격!</button></div>`;
  }
  function drawAns(){
    const box=R.pad.querySelector(".ansbox");if(box)box.textContent=ans;
    R.pad.querySelectorAll(".fbox").forEach(b=>{const f=b.dataset.k.slice(1);b.textContent=fv[f];b.classList.toggle("on",f===fa);});
    R.pad.querySelectorAll(".choices button").forEach((b,i)=>b.setAttribute("aria-pressed",String(i===sel)));
  }
  function question(att){R.msg.innerHTML=`<p class="q">${rich(att.text)}</p>${att.graph?graphSVG(att.graph):""}`;R.pad.innerHTML=padFor(att);drawAns();}
  function waitText(){return D().hp===0?"전설의 포켓몬이 지쳐 쓰러지기 직전이에요! 선생님이 레이드를 끝낼 때까지 기다려요.":"친구들의 공격을 기다리는 중…";}
  function showDone(att){
    shown=att.status;R.pad.innerHTML="";const mon=esc(nameOf(att.mon));
    if(att.status==="hit")R.msg.innerHTML=(att.crit?`<p class="q"><b class="crit">크리티컬!</b> ${mon}의 공격이 급소에 맞았다! <b class="good">두 번 명중!</b></p>`:`<p class="q">${mon}의 공격! <b class="good">명중했다!</b></p>`)+`<p class="sub" id="waitline">${waitText()}</p>`;
    else{R.me.classList.add("fainted");
      R.msg.innerHTML=`<p class="q">${mon}의 공격은 <b class="bad">빗나갔다!</b></p><p class="sub">정답: ${answerHTML(att)}${att.given?` (내 답: ${rich(att.given)})`:""}</p><p class="sub">다음 레이드에서 다시 도전해요.</p>`;}
  }
  return{
    mount(m){
      const {meta,atts,students}=D();const att=atts[S.sid],me=students[S.sid];
      const el=h(`<div class="battle solo">${sceneHTML(meta.boss,att.mon)}<div class="dlg"><div class="in"><div data-r="msg"></div><div data-r="pad"></div></div></div></div>`);
      m.append(el);R=refs(el);
      R.mebox.hidden=false;R.mename.textContent=nameOf(att.mon);R.menum.textContent=`${me.num}번 ${me.name}`;
      if(att.status==="pending"){question(att);setTimeout(()=>Snd.cry(att.mon),300);}
      else showDone(att);
      onKey=e=>{if(shown||animating)return;
        if(/^[0-9.]$/.test(e.key))this.key(e.key);else if(e.key==="Backspace")this.key("del");
        else if(e.key==="Enter")this.key("ok");else if(e.key==="Tab"||e.key==="ArrowRight")this.key("next");else return;
        e.preventDefault();};
      document.addEventListener("keydown",onKey);
    },
    destroy(){document.removeEventListener("keydown",onKey);},
    update(){
      const {atts}=D();const att=atts[S.sid];updateFoe(R);
      if(!att||animating)return;
      if(att.status!=="pending"&&shown!==att.status)showDone(att);
      const w=$("#waitline");if(w)w.textContent=waitText();
    },
    key(k){
      if(shown||animating)return;
      if(k==="ok")return this.submit();
      const att=D().atts[S.sid];if(!att)return;const t=att.type||"num";
      Snd.sfx("key");
      if(t==="choice"){if(k[0]==="c")sel=+k.slice(1);}
      else if(t==="frac"){
        if(k==="fw"||k==="fn"||k==="fd")fa=k[1];
        else if(k==="next")fa={w:"n",n:"d",d:"w"}[fa];
        else if(k==="del")fv[fa]=fv[fa].slice(0,-1);
        else if(/^[0-9]$/.test(k)&&fv[fa].length<3)fv[fa]=(fv[fa]==="0"?"":fv[fa])+k;
      }else{
        if(k==="del")ans=ans.slice(0,-1);
        else if(k==="."){if(!ans.includes("."))ans=(ans||"0")+".";}
        else if(/^[0-9]$/.test(k)){if(ans.length>=6)return;if(ans.includes(".")&&ans.split(".")[1].length>=2)return;ans=ans==="0"?k:ans+k;}
      }
      drawAns();
    },
    async submit(){
      const {meta,atts,raid}=D();const att=atts[S.sid];
      if(meta.stage!=="raid"||!att||att.status!=="pending")return;
      const t=att.type||"num";let hit,given;
      if(t==="choice"){if(sel<0)return toast("답을 먼저 골라 주세요.");hit=sel===att.ans;given=arr(att.choices)[sel];}
      else if(t==="frac"){
        const w=+(fv.w||0),n=+(fv.n||0),d=+(fv.d||0);
        if(!fv.n&&!fv.w)return toast("답을 먼저 입력해 주세요.");
        if(fv.n&&!d)return toast("분모를 입력해 주세요.");
        const num=d?w*d+n:w,den=d||1;hit=num*att.ans.d===att.ans.n*den;
        given=d&&n?`{{${fv.w}|${n}|${d}}}`:String(w);
      }else{
        if(!ans||ans==="."||ans==="0.")return toast("답을 먼저 입력해 주세요.");
        hit=Math.round(parseFloat(ans)*100)===att.ans;given=ans;
      }
      const pw=power(D().students[S.sid],att.mon),crit=hit&&Math.random()<(pw.total||pw.bonus||0)/100000;
      animating=true;R.pad.innerHTML="";
      R.msg.innerHTML=`<p class="q">${esc(nameOf(att.mon))}의 공격!</p>`;
      restart(R.me,"lunge");restart(R.foe,hit?"hurt":"dodge");setTimeout(()=>Snd.sfx(hit?"hit":"miss"),250);
      if(crit){setTimeout(()=>{critFx(R.foe.parentElement);restart(R.me,"lunge");restart(R.foe,"hurt");},650);setTimeout(()=>Snd.sfx("hit"),900);}
      try{await Store.update(`rooms/${S.code}/attempts/r${raid}/${S.sid}`,{status:hit?"hit":"miss",crit,given,done:Date.now()});}
      catch(e){animating=false;question(att);toast("저장하지 못했어요. 다시 공격해 주세요.");return;}
      setTimeout(()=>{animating=false;if(R.msg.isConnected)showDone({...att,status:hit?"hit":"miss",crit,given});},crit?1800:1100);
    }
  };
}

/* ---------------- 선생님: 오늘의 성장 확인 ---------------- */
function TeacherGrowth(){
  let R;
  return{
    mount(m){
      const el=h(`<div><div class="phead"><button class="btn small" data-act="tPage" data-p="">← 레이드 화면으로</button><h2>오늘의 성장 확인</h2></div>
        <section class="win"><h2>확인할 글 <span data-r="pc"></span></h2><p class="hint">아이템 수를 정한 뒤 승인하면 학생에게 바로 들어가요. 아이템 없이 승인만 할 수도 있어요.</p><div class="mt" data-r="pend"></div></section>
        <section class="win mt"><h2>지난 글</h2><div data-r="done"></div></section></div>`);
      m.append(el);R=refs(el);
    },
    update(){
      const {room}=D();const all=Object.entries(room.growth||{}).filter(([,g])=>g);
      const pend=all.filter(([,g])=>g.status==="pending").sort((a,b)=>(a[1].at||0)-(b[1].at||0));
      const done=all.filter(([,g])=>g.status!=="pending").sort((a,b)=>(b[1].decided||0)-(a[1].decided||0)).slice(0,40);
      R.pc.textContent=`${pend.length}개`;
      setHTML(R.pend,pend.length?pend.map(([gid,g])=>{
        const rw=T.rw[gid]||(T.rw[gid]={atk:0,deco:0,evo:0}),tot=rw.atk+rw.deco+rw.evo;
        return `<div class="gcard"><div class="gmeta"><b>${g.num}번 ${esc(g.name)}</b> <span class="tag2">${esc(g.cat)}</span> <span class="hint">${esc(g.date)}</span></div>
          <p class="gtext">${esc(g.text)}</p>
          <div class="rw">${Object.entries(ITEMS).map(([k,it])=>`<span class="rwi">${it.e} ${it.n}
            <button class="btn small" data-act="rw" data-g="${gid}" data-k="${k}" data-d="-1" aria-label="${it.n} 줄이기">−</button><b>${rw[k]}</b>
            <button class="btn small" data-act="rw" data-g="${gid}" data-k="${k}" data-d="1" aria-label="${it.n} 늘리기">+</button></span>`).join("")}</div>
          <div class="gbtns"><button class="btn blue" data-act="gok" data-g="${gid}">${tot?`승인하고 아이템 ${tot}개 주기`:"승인하기"}</button>
            <button class="btn" data-act="gno" data-g="${gid}">돌려보내기</button></div></div>`;
      }).join(""):'<p class="hint">확인할 글이 없어요.</p>');
      setHTML(R.done,done.length?done.map(([,g])=>{const rw=g.reward||{};
        const got=Object.keys(ITEMS).filter(k=>rw[k]).map(k=>`${ITEMS[k].e}${rw[k]}`).join(" ");
        return `<div class="gcard"><div class="gmeta"><b>${g.num}번 ${esc(g.name)}</b> <span class="tag2">${esc(g.cat)}</span> <span class="hint">${esc(g.date)}</span>
          <span class="st ${g.status}">${g.status==="approved"?"승인함":"돌려보냄"}</span> ${got}</div><p class="gtext">${esc(g.text)}</p></div>`;
      }).join(""):'<p class="hint">아직 없어요.</p>');
    }
  };
}

  },
  useItem(b){openUse(b.dataset.k);},
  useOn(b){const id=+b.dataset.id;if(b.dataset.k==="atk"){if(confirm(`${nameOf(id)}에게 파워 사탕을 줄까요?`))useAtk(id);}else chooseEvo(id);},
  evoTo(b){evolve(+b.dataset.from,+b.dataset.to);},
  rw(b){const r=T.rw[b.dataset.g];if(!r)return;r[b.dataset.k]=Math.max(0,Math.min(5,r[b.dataset.k]+(+b.dataset.d)));cur.v.update();},
  async gok(b){
    const gid=b.dataset.g,{room,students}=D(),g=(room.growth||{})[gid];if(!g)return;
    const rw=T.rw[gid]||{atk:0,deco:0,evo:0},st=students[g.sid],it=(st&&st.items)||{};
    const upd={[`growth/${gid}/status`]:"approved",[`growth/${gid}/reward`]:rw,[`growth/${gid}/decided`]:Date.now()};
    if(st)for(const k of Object.keys(ITEMS))if(rw[k])upd[`students/${g.sid}/items/${k}`]=(it[k]||0)+rw[k];
    await Store.update("rooms/"+S.code,upd);delete T.rw[gid];
    toast(`${g.name}의 글을 승인했어요.`);
  },
  async gno(b){
    const gid=b.dataset.g,g=(D().room.growth||{})[gid];if(!g)return;
    if(!confirm(`${g.name}의 글을 돌려보낼까요? 학생이 다시 쓸 수 있어요.`))return;
    await Store.update(`rooms/${S.code}/growth/${gid}`,{status:"returned",decided:Date.now()});
  }
};
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b||b.disabled)return;
  const f=ACT[b.dataset.act];if(f){e.preventDefault();if(b.dataset.act!=="key")Snd.sfx("blip");f(b);}
});
addEventListener("unhandledrejection",e=>{
  const m=String(e.reason&&e.reason.message||e.reason||"");
  toast(/permission/i.test(m)?"서버가 접속을 막고 있어요. Firebase의 규칙 설정을 확인해 주세요.":"서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.");
});
modal.addEventListener("click",e=>{if(e.target===modal)ACT.closeModal();});

/* ---------------- 시작 ---------------- */
(async function boot(){
  await Store.init();loadMoreNames();loadGameData();
  const qp=(new URLSearchParams(location.search).get("room")||"").replace(/\D/g,"").slice(0,6);
  if(qp)history.replaceState(null,"",location.pathname);
  const tc=sessionStorage.getItem("pkraid-teacher");
  if(tc&&!qp&&(await Store.get(`rooms/${tc}/meta`))){enterRoom("teacher",tc);return;}
  let u=null;try{u=JSON.parse(ls().getItem("pkraid-user"));}catch(e){}
  if(u){
    const acc=await Store.get("accounts/"+u.key);
    if(acc&&acc.pw===u.pw){
      S.user=u;
      if(qp&&(await joinRoom(qp)))return;
      const last=ls().getItem("pkraid-lastroom");
      if(last&&(await Store.get(`rooms/${last}/students/${u.key}`))){enterRoom("student",last);return;}
      show("lobby",StudentLobby);return;
    }
    ls().removeItem("pkraid-user");
  }
  S.pending=qp||null;show("home",HomeView);
})();
</script>
